services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api

  backend:
    build: ./backend
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        python manage_db.py check-connection &&
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Checking if data already exists...' &&
        if python manage_db.py check-data-exists --table-name guides | grep -q 'Found 0 records'; then
          echo 'Loading data from guides_data.sql...' &&
          psql "$$DATABASE_URL" -f /app/../guides_data.sql
        else
          echo 'Guides data already exists, skipping SQL import'
        fi &&
        if python manage_db.py check-data-exists --table-name videos | grep -q 'Found 0 records'; then
          echo 'Loading data from videos_data.sql...' &&
          psql "$$DATABASE_URL" -f /app/../videos_data.sql
        else
          echo 'Videos data already exists, skipping SQL import'
        fi &&
        echo 'Starting application...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./roadmapdb_fixed.sql:/app/../roadmapdb_fixed.sql
      - ./guides_data.sql:/app/../guides_data.sql
      - ./videos_data.sql:/app/../videos_data.sql
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine # Official Postgres image
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=roadmapdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roadmapdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

