services:
  backend:
    build: ./backend
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        python manage_db.py check-connection &&
        echo 'Creating tables...' &&
        python manage_db.py create-tables &&
        echo 'Loading data from roadmapdb_fixed.sql...' &&
        psql "$$DATABASE_URL" -f /app/../roadmapdb_fixed.sql &&
        echo 'Starting application...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./roadmapdb_fixed.sql:/app/../roadmapdb_fixed.sql
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=roadmapdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roadmapdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

